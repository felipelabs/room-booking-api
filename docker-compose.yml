services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: bookings
      POSTGRES_PASSWORD: bookings
    ports:
      - "5432:5432"
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookings -d bookings"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bookings
      DB_USERNAME: bookings
      DB_PASSWORD: bookings
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  booking-data:
